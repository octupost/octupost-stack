<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Agent Research Pack</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="API documentation for building a video editing and image generation agent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <!-- Custom styles -->
  <style>
    :root {
      --base-background-color: #0d1117;
      --sidebar-background: #161b22;
      --sidebar-nav-link-color--active: #58a6ff;
      --sidebar-nav-link-border-color--active: #58a6ff;
      --cover-background-color: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --heading-color: #c9d1d9;
      --text-color: #8b949e;
      --link-color: #58a6ff;
      --code-inline-background: #21262d;
      --code-theme-background: #161b22;
      --blockquote-border-color: #30363d;
      --table-row-odd-background: #161b22;
    }
    
    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }
    
    .markdown-section h1 {
      border-bottom: 2px solid #30363d;
      padding-bottom: 0.5em;
    }
    
    .markdown-section table {
      display: table;
      width: 100%;
    }
    
    .markdown-section code {
      border-radius: 6px;
    }
    
    .cover-main {
      text-align: center;
    }
    
    .cover-main > p:last-child a {
      border-radius: 8px;
      padding: 12px 32px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  
  <script>
    window.$docsify = {
      name: '📚 Media Agent',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!'
      },
      tabs: {
        persist: true,
        sync: true
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true
      }
    }
  </script>
  
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  
  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
